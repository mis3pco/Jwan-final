:wrap;gap:8px;margin-top:12px}.wallet{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:20px;padding:22px;margin-bottom:14px}.wallet .balance{font-size:2.1rem;font-weight:900}.wallet .small{opacity:.78;font-size:.82rem}.filebox{border:1.5px dashed var(--border);padding:15px;border-radius:13px;background:#fbfefe}.list{display:grid;gap:10px}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:.8rem}.table th,.table td{padding:9px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right}.progress{height:8px;background:#e5efee;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--brand)}.empty{padding:35px;text-align:center;color:var(--muted)}.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--brand)}.stars button{border:0;background:transparent;font-size:1.7rem;color:#d5d5d5}.stars button.active{color:#f59e0b}.footer-note{font-size:.75rem;color:var(--muted);margin-top:18px;text-align:center}

function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function money(n){return new Intl.NumberFormat('ar-SD',{maximumFractionDigits:2}).format(Number(n||0));}
function date(v){if(!v)return '—';const d=v.toDate?v.toDate():new Date(v);return d.toLocaleString('ar-SD',{dateStyle:'medium',timeStyle:'short'});}
function daysInactive(last){if(!last)return '—';const t=last.toDate?last.toDate().getTime():new Date(last).getTime();return Math.max(0,Math.floor((Date.now()-t)/86400000));}
function roleLabel(r){return r==='driver'?'سائق موتر':r==='admin'?'مدير':'عميل';}
function statusLabel(s){return ({pending:'في الانتظار',accepted:'مقبول',picked_up:'استُلمت',driver_delivered:'وصلت للوجهة',completed:'مكتملة',cancelled:'ملغاة'}[s]||s);}
function tag(s){let cls='';if(['pending'].includes(s))cls='warn';if(['cancelled'].includes(s))cls='danger';if(['accepted','picked_up'].includes(s))cls='info';return `<span class="tag ${cls}">${esc(statusLabel(s))}</span>`;}
function toast(msg){const d=document.createElement('div');d.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:999;background:#0f2523;color:#fff;padding:11px 16px;border-radius:999px;font-size:.82rem';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000);}
function cf(name,data={}){return fn.httpsCallable(name)(data);}
function localData(key,def){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(def))}catch{return def}}
function setLocal(key,val){localStorage.setItem(key,JSON.stringify(val));}
function authView(){return `<div class="auth"><div class="auth-card"><div class="brand"><img src="assets/logo.svg"/><div><h1>جوان للتوصيل</h1><div class="sub">التوصيل داخل بورتسودان فقط</div></div></div><div class="tabs"><button class="${S.tab==='login'?'active':''}" onclick="S.tab='login';authView()">تسجيل الدخول</button><button class="${S.tab==='register'?'active':''}" onclick="S.tab='register';authView()">إنشاء حساب</button></div>${S.tab==='login'?loginForm():registerForm()}<div class="footer-note">⚡ سريع · آمن · واضح · إدارة ومتابعة من منصة واحدة</div></div></div>`}
function loginForm(){return `<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></div><button class="btn primary full" onclick="login()">تسجيل الدخول</button><button class="btn oauth" onclick="googleLogin()">متابعة باستخدام Google</button><div class="actions"><button class="btn ghost" onclick="resetPass()">نسيت كلمة المرور؟</button></div>${!READY?'<div class="notice warn" style="margin-top:10px">Firebase غير مربوط بعد. أكمل ملف CONFIG ثم انشر المشروع.</div>':''}`}
function registerForm(){return `<div class="grid2"><div class="field"><label>الاسم الكامل</label><input id="rname" placeholder="محمد أحمد"></div><div class="field"><label>رقم الهاتف</label><input id="rphone" inputmode="numeric" maxlength="10" placeholder="09xxxxxxxx"></div></div><div class="field"><label>البريد الإلكتروني</label><input id="remail" type="email" placeholder="you@example.com"></div><div class="grid2"><div class="field"><label>كلمة المرور</label><input id="rpass" type="password" minlength="6" placeholder="6 أحرف على الأقل"></div><div class="field"><label>العمر</label><input id="rage" type="number" min="18" placeholder="18"></div></div><div class="field"><label>نوع الحساب</label><select id="rrole" onchange="renderRegExtra()"><option value="customer">عميل</option><option value="driver">سائق موتر</option></select></div><div id="reg-extra"></div><label class="check"><input id="privacy" type="checkbox"> أوافق على <a href="?policy=privacy" target="blank">سياسة الخصوصية</a> و<a href="?policy=terms" target="blank">شروط العمل</a>.</label><button class="btn primary full" onclick="register()">إنشاء الحساب</button><button class="btn oauth" onclick="googleRegister()">التسجيل باستخدام Google</button>`}
function renderRegExtra(){const role=document.getElementById('rrole')?.value;const el=document.getElementById('reg-extra');if(!el)return;el.innerHTML=`<div class="notice">سيُنشأ الحساب أولاً، لكن لن يتم تفعيله إلا بعد إكمال متطلبات التحقق وموافقة الإدارة.</div><div class="field"><label>مكان السكن</label><input id="rres" placeholder="الحي / المنطقة داخل بورتسودان"></div><div class="field"><label>صورة إثبات شخصية</label><input id="rid" type="file" accept="image/*,application/pdf"></div>${role==='driver'?`<div class="field"><label>صورة استيكر الموتر أو شهادة الوارد</label><input id="rsticker" type="file" accept="image/*,application/pdf"></div><div class="field"><label>إثبات من المالك أو السائق</label><input id="rowner" type="file" accept="image/*,application/pdf"></div><div class="notice warn">رسوم تفعيل السائق لأول مرة: 10,000 جنيه. بعد الموافقة يمكنك شحن المحفظة وسحب أرباحك دون دفع رسوم اشتراك مرة أخرى.</div>`:''}`}
function policyView(kind){const privacy=kind==='privacy';return `<div class="auth"><div class="auth-card"><div class="brand"><img src="assets/logo.svg"/><div><h1>جوان للتوصيل</h1><div class="sub">${privacy?'سياسة الخصوصية':'شروط العمل'}</div></div></div>${privacy?`<div class="card"><b>البيانات</b><p class="muted">نستخدم بيانات الحساب، رقم الهاتف، المستندات التي ترفعها، الطلبات، المحافظ، المعاملات، التقييمات ورسائل الدعم لتشغيل الخدمة وحمايتها وتحسينها.</p><b>الوصول</b><p class="muted">الإدارة يمكنها الاطلاع على البريد الإلكتروني والمستندات والبيانات اللازمة للإدارة. العميل والسائق يظهر لهما الاسم ورقم التواصل فقط، ولا يظهر البريد الإلكتروني بين الطرفين.</p><b>الملفات</b><p class="muted">ترفع الإيصالات والمستندات إلى التخزين السحابي وتُستخدم للتحقق والمراجعة فقط.</p><b>الأمان</b><p class="muted">الدخول يتم عبر Firebase Authentication، والعمليات الحساسة مثل الرصيد والعمولات تنفذ من وظائف خادمية وقواعد وصول.</p></div>`:`<div class="card"><p class="muted">1) العمر لا يقل عن 18 سنة.</p><p class="muted">2) السائق يسدد 10,000 جنيه لأول تفعيل لإثبات الالتزام والمصداقية.</p><p class="muted">3) التعامل باحترام مع الزبون، وعند سوء الفهم يتم التواصل مع الشركة.</p><p class="muted">4) الغياب أكثر من 5 أيام دون إخطار قد يؤدي إلى إغلاق الحساب.</p><p class="muted">5) عند حدوث ظرف يمنع إكمال الطلب خلال 60 دقيقة، يجب إخطار الشركة ليُسلَّم الطلب لسائق آخر.</p><p class="muted">6) يمنع تحصيل سعر التوصيل إذا لم يصل الطلب إلى الزبون.</p><p class="muted">7) بعد قبول الطلب يجب الاتصال بالزبون مباشرة، وإذا تعذر الوصول إليه يتم الرجوع للإدارة.</p><p class="muted">8) يجب أخذ فاتورة الطلب، وإذا لم توجد فاتورة يجب تأكيد الأسعار قبل الشراء.</p><p class="muted">9) يمنع تشغيل سائق آخر على حسابك.</p><p class="muted">الحوافز: تُمنح مكافآت لأفضل 3 سائقين حسب عدد الطلبات وزمن التوصيل، وفق سياسة الإدارة.</p><p class="muted">التوصيل داخل بورتسودان فقط.</p></div>`}<button class="btn primary full" onclick="location.href='/'">العودة</button></div></div>`}
function mount(){if(location.search.includes('policy=privacy')){document.getElementById('root').innerHTML=policyView('privacy');return}if(location.search.includes('policy=terms')){document.getElementById('root').innerHTML=policyView('terms');return}if(!me){document.getElementById('root').innerHTML=authView();renderRegExtra();return}renderApp();}
async function login(){if(!READY)return toast('أكمل ربط Firebase أولاً');const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass)return toast('أكمل البيانات');try{await auth.signInWithEmailAndPassword(email,pass)}catch(e){toast('بيانات الدخول غير صحيحة أو الحساب غير متاح')}}
async function googleLogin(){if(!READY)return toast('أكمل ربط Firebase أولاً');try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){toast('تعذر تسجيل الدخول عبر Google')}}
async function resetPass(){if(!READY)return toast('أكمل ربط Firebase أولاً');const email=document.getElementById('email').value.trim();if(!email)return toast('اكتب بريدك أولاً');try{await auth.sendPasswordResetEmail(email);toast('تم إرسال رابط إعادة كلمة المرور')}catch(e){toast('تعذر إرسال الرسالة')}}
async function uploadFile(file,path){if(!file)return null;if(file.size>10*1024*1024)throw new Error('حجم الملف يتجاوز 10MB');const ok=['image/jpeg','image/png','image/webp','application/pdf'];if(!ok.includes(file.type))throw new Error('صيغة الملف غير مدعومة');const ref=storage.ref().child(path);await ref.put(file,{contentType:file.type});return ref.getDownloadURL()}
async function register(){if(!READY)return toast('أكمل ربط Firebase أولاً');const name=document.getElementById('rname').value.trim(),phone=document.getElementById('rphone').value.trim(),email=document.getElementById('remail').value.trim(),pass=document.getElementById('rpass').value,age=Number(document.getElementById('rage').value),role=document.getElementById('rrole').value,res=document.getElementById('rres').value.trim();if(!name||!email||!pass||!phone||!age||!res)return toast('أكمل جميع الحقول');if(!/^0\d{9}$/.test(phone))return toast('رقم الهاتف يجب أن يكون 10 أرقام ويبدأ بـ 0');if(age<18)return toast('العمر يجب ألا يقل عن 18 سنة');if(!document.getElementById('privacy').checked)return toast('يجب الموافقة على سياسة الخصوصية والشروط');try{const cred=await auth.createUserWithEmailAndPassword(email,pass);await cred.user.sendEmailVerification();const uid=cred.user.uid;const idUrl=await uploadFile(document.getElementById('rid').files[0],`users/${uid}/identity/${Date.now()}`);let stickerUrl=null,ownerUrl=null;if(role==='driver'){stickerUrl=await uploadFile(document.getElementById('rsticker').files[0],`users/${uid}/driver/${Date.now()}-sticker`);ownerUrl=await uploadFile(document.getElementById('rowner').files[0],`users/${uid}/driver/${Date.now()}-owner`);if(!idUrl||!stickerUrl||!ownerUrl)throw new Error('ملفات السائق ناقصة')}else if(!idUrl)throw new Error('صورة إثبات الشخصية مطلوبة');await db.collection('users').doc(uid).set({name,email,phone,role,age,residence:res,identityUrl:idUrl,stickerUrl:stickerUrl||null,ownerProofUrl:ownerUrl||null,privacyAccepted:true,termsAccepted:true,emailVerified:false,isActive:false,isBlocked:false,activationFeePaid:role==='customer',walletBalance:0,activeDays:[],lastActiveAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast('تم إنشاء الحساب. تحقق من بريدك وأكمل التفعيل.');await enterUser(cred.user)}catch(e){toast(e.message||'تعذر إنشاء الحساب')}}
async function googleRegister(){if(!READY)return toast('أكمل ربط Firebase أولاً');try{const cred=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());const ref=db.collection('users').doc(cred.user.uid);const snap=await ref.get();if(!snap.exists){await ref.set({name:cred.user.displayName||'',email:cred.user.email||'',phone:'',role:'customer',age:18,residence:'',identityUrl:null,privacyAccepted:false,termsAccepted:false,emailVerified:true,isActive:false,isBlocked:false,activationFeePaid:true,walletBalance:0,activeDays:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast('أكمل بيانات التفعيل من صفحة حسابي')}await enterUser(cred.user)}catch(e){toast('تعذر التسجيل عبر Google')}}
async function enterUser(u){me=u;try{await u.reload()}catch{};const snap=await db.collection('users').doc(u.uid).get();userDoc=snap.data()||{};const verified=!!u.emailVerified;if(userDoc.emailVerified!==verified){try{await db.collection('users').doc(u.uid).set({emailVerified:verified},{merge:true});userDoc.emailVerified=verified}catch{}}try{await cf('touchActivity')({})}catch{};await requestNotifications(false);mount();}
function nav(){const admin=userDoc?.role==='admin';const items=admin?['home','orders','users','topups','withdrawals','messages','settings']:userDoc?.role==='driver'?['home','orders','wallet','topup','withdraw','account','messages']:['home','neworder','orders','wallet','topup','account','messages'];const names={home:'الرئيسية',neworder:'طلب جديد',orders:userDoc?.role==='driver'?'الطلبات':'طلباتي',users:'المستخدمون',topups:'طلبات الشحن',withdrawals:'طلبات السحب',wallet:'المحفظة',topup:'شحن المحفظة',account:'حسابي وتفعيل الحساب',messages:'تواصل مع الإدارة',settings:'الإعدادات'};return items.map(i=>`<button class="side-btn ${S.page===i?'active':''}" onclick="S.page='${i}';renderApp()">${names[i]||i}</button>`).join('')}
function renderApp(){document.getElementById('root').innerHTML=`<div class="app"><div class="topbar"><div class="brand-mini"><img src="assets/logo.svg"/><span>جوان للتوصيل</span></div><div class="top-actions"><span style="font-size:.76rem">${esc(userDoc?.name||me.email)} · ${roleLabel(userDoc?.role)}</span><button class="btn ghost" onclick="logout()">خروج</button></div></div><div class="content"><div class="layout"><aside class="sidebar">${nav()}</aside><main class="page" id="page"></main></div></div></div>`;renderPage();}
async function renderPage(){const el=document.getElementById('page');el.innerHTML='<div class="empty">جاري التحميل…</div>';const p=S.page;if(p==='home')return renderHome(el);if(p==='neworder')return renderNewOrder(el);if(p==='orders')return renderOrders(el);if(p==='wallet')return renderWallet(el);if(p==='topup')return renderTopup(el);if(p==='withdraw')return renderWithdraw(el);if(p==='account')return renderAccount(el);if(p==='messages')return renderMessages(el);if(p==='users')return renderUsers(el);if(p==='topups')return renderAdminTopups(el);if(p==='withdrawals')return renderAdminWithdrawals(el);if(p==='settings')return renderSettings(el)}
async function getUser(id){const s=await db.collection('users').doc(id).get();return s.exists?s.data():null}
async function renderHome(el){if(userDoc.role==='admin'){const [os,us,ts]=await Promise.all([db.collection('orders').get(),db.collection('users').get(),db.collection('topups').where('status','==','pending').get()]);const a=os.docs.map(d=>d.data()),drivers=us.docs.map(d=>d.data()).filter(x=>x.role==='driver'),completed=a.filter(x=>x.status==='completed'),rev=completed.reduce((s,x)=>s+Number(x.companyCommission||0),0);el.innerHTML=`<div class="page-title"><h2>لوحة الإدارة</h2><span class="tag">مراقبة مباشرة</span></div><div class="cards"><div class="stat"><div class="n">${a.length}</div><div class="l">إجمالي الطلبات</div></div><div class="stat"><div class="n">${drivers.length}</div><div class="l">السائقون</div></div><div class="stat"><div class="n">${completed.length}</div><div class="l">مكتملة</div></div><div class="stat"><div class="n">${money(rev)} ج</div><div class="l">عمولة الشركة</div></div></div><div class="split"><div class="card"><h3>آخر الطلبات</h3>${a.slice(-8).reverse().map(o=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--border)"><div><div class="route">${esc(o.from)} ← ${esc(o.to)}</div><div class="muted">${money(o.price||0)} ج · ${esc(o.customerName||'')}</div></div>${tag(o.status)}</div>`).join('')||'<div class="empty">لا توجد طلبات</div>'}</div><div class="card"><h3>تنبيهات</h3><div class="notice">طلبات شحن معلقة: ${ts.size}</div><div class="notice" style="margin-top:8px">السائقون النشطون: ${drivers.filter(d=>d.isActive&&!d.isBlocked).length}</div><div class="notice warn" style="margin-top:8px">السائقون غير النشطين: ${drivers.filter(d=>daysInactive(d.lastActiveAt)>=5).length}</div></div></div>`;return}el.innerHTML=`<div class="page-title"><h2>مرحباً ${esc(userDoc?.name||'')}</h2>${tag(userDoc?.isActive?'completed':'pending')}</div><div class="cards"><div class="stat"><div class="n">${money(userDoc?.walletBalance||0)}</div><div class="l">رصيد المحفظة</div></div><div class="stat"><div class="n">${userDoc?.activeDays?.length||0}</div><div class="l">أيام النشاط</div></div><div class="stat"><div class="n">${daysInactive(userDoc?.lastActiveAt)}</div><div class="l">أيام منذ آخر نشاط</div></div><div class="stat"><div class="n">${userDoc?.isActive?'مفعل':'قيد التفعيل'}</div><div class="l">حالة الحساب</div></div></div>${userDoc?.role==='driver'?`<div class="notice">بعد قبول الطلب يجب الاتصال بالعميل، ثم الضغط على «تم الاستلام» وبعد الوصول «تم الوصول للوجهة». عمولة 5% تُحجز عند قبول الطلب، وبعد إكمال الطرفين يحصل السائق على 95% من السعر.</div>`:`<div class="notice">يجب أن يكون لديك رصيد قبل رفع الطلب. لا يظهر للسائق من بياناتك إلا الاسم ورقم التواصل.</div>`}`}
function renderNewOrder(el){el.innerHTML=`<div class="page-title"><h2>طلب توصيل جديد</h2><span class="tag">داخل بورتسودان</span></div><div class="card"><div class="grid2"><div class="field"><label>مكان الاستلام</label><input id="from" placeholder="اسم المطعم / الموقع"></div><div class="field"><label>وجهة التسليم</label><input id="to" placeholder="الحي / الموقع"></div></div><div class="grid2"><div class="field"><label>نوع الطلب</label><select id="otype"><option>طعام</option><option>طرد</option><option>مستندات</option><option>أغراض</option><option>أخرى</option></select></div><div class="field"><label>طريقة التسعير</label><select id="pricing"><option value="customer">أنا أحدد السعر</option><option value="admin">اترك السعر للإدارة</option></select></div></div><div class="field"><label>السعر (جنيه) — اختياري إذا كانت الإدارة ستحدد السعر</label><input id="price" type="number" min="1" placeholder="3000"></div><div class="field"><label>ملاحظات / تفاصيل الطلب</label><textarea id="desc" placeholder="اسم المطعم، محتوى الطلب، تعليمات الوصول…"></textarea></div><button class="btn primary full" onclick="createOrder()">إرسال طلب التوصيل</button></div>`}
async function createOrder(){if(!userDoc.isActive)return toast('فعّل حسابك أولاً');const from=document.getElementById('from').value.trim(),to=document.getElementById('to').value.trim(),type=document.getElementById('otype').value,pricingMode=document.getElementById('pricing').value,price=Number(document.getElementById('price').value),desc=document.getElementById('desc').value.trim();if(!from||!to)return toast('أدخل الاستلام والوجهة');if(userDoc.walletBalance<=0)return toast('يجب شحن محفظتك قبل رفع الطلب');if(pricingMode==='customer'&&(!price||price<=0))return toast('أدخل السعر');if(pricingMode==='customer'&&price>userDoc.walletBalance)return toast('الرصيد لا يكفي للسعر المحدد');try{await cf('createOrder')({from,to,type,description:desc,pricingMode,price:pricingMode==='customer'?price:null});toast('تم إرسال الطلب');S.page='orders';renderApp()}catch(e){toast(e.message||'تعذر إرسال الطلب')}}
async function renderOrders(el){if(userDoc.role==='admin')return renderAdminOrders(el);const isD=userDoc.role==='driver';if(isD){const snap=await db.collection('orders').where('status','in',['pending','accepted','picked_up','driver_delivered']).limit(100).get();const os=snap.docs.map(d=>({id:d.id,...d.data()}));el.innerHTML=`<div class="page-title"><h2>الطلبات</h2><button class="btn secondary" onclick="requestNotifications(true)">تفعيل الإشعارات</button></div><div class="list">${os.map(o=>driverOrderCard(o)).join('')||'<div class="empty">لا توجد طلبات حالياً</div>'}</div>`}else{const snap=await db.collection('orders').where('customerId','==',me.uid).limit(100).get();const os=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));el.innerHTML=`<div class="page-title"><h2>طلباتي</h2><button class="btn primary" onclick="S.page='neworder';renderApp()">طلب جديد</button></div><div class="list">${os.map(o=>customerOrderCard(o)).join('')||'<div class="empty">لا توجد طلبات</div>'}</div>`}}
function baseOrder(o,extra=''){return `<div class="card"><div class="row"><div><div class="route">${esc(o.from)} → ${esc(o.to)}</div><div class="muted">النوع: ${esc(o.type)} · السعر: ${o.price==null?'بانتظار التسعير':money(o.price)+' ج'}<br>${esc(o.description||'')}</div></div>${tag(o.status)}</div>${extra}</div>`}
function driverOrderCard(o){const cost=(Number(o.price||0)*.05);let a='';if(o.status==='pending')a=`<button class="btn primary" onclick="acceptOrder('${o.id}')">قبول الطلب</button><button class="btn ghost" onclick="commentPrice('${o.id}')">السعر غير مناسب</button>`;if(o.status==='accepted')a=`<button class="btn warn" onclick="picked('${o.id}')">تم الاستلام</button><button class="btn secondary" onclick="contact('${esc(o.customerPhone||'')}')">اتصال بالعميل</button><div class="muted">مطلوب عند القبول: الاتصال بالعميل. العمولة المحجوزة: ${money(cost)} ج</div>`;if(o.status==='picked_up')a=`<button class="btn primary" onclick="driverDelivered('${o.id}')">تم الوصول للوجهة</button><div class="timer" data-timer="${o.acceptedAt?.toMillis?o.acceptedAt.toMillis():Date.now()}"></div>`;if(o.status==='driver_delivered')a=`<button class="btn primary" onclick="toast('بانتظار تأكيد العميل')">بانتظار العميل</button>`;return baseOrder(o,`<div class="muted">العميل: ${esc(o.customerName||'')} · ${esc(o.customerPhone||'')}</div><div class="actions">${a}</div>`)}
function customerOrderCard(o){let a='';if(o.status==='driver_delivered')a=`<button class="btn primary" onclick="confirmOrder('${o.id}')">تأكيد وصول الطلب</button><button class="btn ghost" onclick="rateOrder('${o.id}')">تقييم الخدمة</button>`;if(o.status==='accepted'||o.status==='picked_up')a=`<div class="muted">السائق: ${esc(o.driverName||'')} · ${esc(o.driverPhone||'')}</div><button class="btn secondary" onclick="contact('${esc(o.driverPhone||'')}')">اتصال بالسائق</button>`;return baseOrder(o,`<div class="actions">${a}</div>${o.pricingMode==='admin'&&o.price==null?'<div class="notice warn" style="margin-top:8px">الإدارة ستحدد السعر.</div>':''}`)}
async function acceptOrder(id){try{await cf('acceptOrder')({orderId:id});toast('تم قبول الطلب وحجز العمولة');renderApp()}catch(e){toast(e.message||'تعذر قبول الطلب')}}
async function picked(id){try{await cf('updateOrderStatus')({orderId:id,status:'picked_up'});toast('تم تسجيل الاستلام');renderApp()}catch(e){toast(e.message||'تعذر التحديث')}}
async function driverDelivered(id){try{await cf('updateOrderStatus')({orderId:id,status:'driver_delivered'});toast('تم تسجيل الوصول للوجهة');renderApp()}catch(e){toast(e.message||'تعذر التحديث')}}
async function confirmOrder(id){try{await cf('confirmDelivery')({orderId:id});toast('تم إكمال الطلب وتقسيم المبلغ');renderApp()}catch(e){toast(e.message||'تعذر الإكمال')}}
async function commentPrice(id){const text=prompt('اكتب تعليقك للسعر');if(!text)return;try{await cf('commentOnOrder')({orderId:id,text});toast('تم إرسال التعليق')}catch(e){toast(e.message||'تعذر الإرسال')}}
function contact(phone){if(!phone)return;location.href='tel:'+phone}
function rateOrder(id){const r=prompt('التقييم من 1 إلى 5');const n=Number(r);if(!Number.isInteger(n)||n<1||n>5)return toast('تقييم غير صحيح');const comment=prompt('تعليق اختياري')||'';cf('rateOrder',{orderId:id,rating:n,comment}).then(()=>toast('شكراً على تقييمك')).catch(e=>toast(e.message||'تعذر إرسال التقييم'))}
async function renderWallet(el){el.innerHTML=`<div class="page-title"><h2>المحفظة</h2></div><div class="wallet"><div class="small">الرصيد الحالي</div><div class="balance">${money(userDoc.walletBalance)} ج</div><div class="small">السائق: الرصيد يُستخدم لحجز عمولة 5% عند قبول الطلب. العميل: الرصيد يُخصم عند إكمال الطلب.</div></div><div class="card"><h3>سجل العمليات</h3><div id="txlist" class="list"></div></div>`;const q=await db.collection('transactions').where('userId','==',me.uid).limit(100).get();document.getElementById('txlist').innerHTML=q.docs.map(d=>{const t=d.data();return `<div class="row"><div><b>${esc(t.label||t.type)}</b><div class="muted">${date(t.createdAt)}</div></div><b>${t.amount>=0?'+':''}${money(t.amount)} ج</b></div>`}).join('')||'<div class="empty">لا توجد عمليات</div>'}
function renderTopup(el){const activation=userDoc.role==='driver'&&!userDoc.activationFeePaid;el.innerHTML=`<div class="page-title"><h2>${activation?'تفعيل السائق — الدفع الأول':'شحن المحفظة'}</h2><span class="tag">صورة أو PDF</span></div><div class="card">${activation?'<div class="notice warn">رسوم التفعيل الأولى للسائق: <b>10,000 جنيه</b>. تُدفع مرة واحدة فقط للمراجعة والمصداقية، وليست مطلوبة بعد التفعيل.</div>':''}<div class="field"><label>المبلغ</label><input id="tamount" type="number" min="1" ${activation?'value="10000" disabled':''} placeholder="5000"></div><div class="field"><label>طريقة الدفع</label><select id="tmethod">${METHODS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>صورة/ملف إشعار التحويل</label><input id="treceipt" type="file" accept="image/*,application/pdf"></div><div class="notice">لا نطلب رقم إشعار. نحتاج فقط المبلغ، طريقة الدفع، وصورة/ملف الإشعار للموافقة أو الرفض من الإدارة.</div><button class="btn primary full" style="margin-top:12px" onclick="submitTopup(${activation})">إرسال للمراجعة</button></div>`}
async function submitTopup(activation=false){const amount=Number(document.getElementById('tamount').value),method=document.getElementById('tmethod').value,file=document.getElementById('treceipt').files[0];if(!amount||amount<=0||!file)return toast('أدخل المبلغ وارفع الإشعار');try{const url=await uploadFile(file,`receipts/${me.uid}/${Date.now()}`);await cf('submitTopup')({amount,method,purpose:activation?'activation':'wallet',receiptUrl:url,receiptName:file.name});toast('تم إرسال طلب الشحن للمراجعة');S.page='wallet';renderApp()}catch(e){toast(e.message||'تعذر إرسال الشحن')}}
function renderWithdraw(el){if(userDoc.role!=='driver'){el.innerHTML='<div class="empty">السحب متاح للسائقين فقط.</div>';return}el.innerHTML=`<div class="page-title"><h2>سحب الأرباح</h2></div><div class="card"><div class="field"><label>المبلغ</label><input id="wamount" type="number" min="1"></div><div class="field"><label>طريقة السحب</label><select id="wmethod">${METHODS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>رقم الحساب/الهاتف المستلم</label><input id="waccount" inputmode="numeric" maxlength="10" placeholder="09xxxxxxxx"></div><button class="btn primary full" onclick="requestWithdraw()">طلب سحب</button></div>`}
async function requestWithdraw(){const amount=Number(document.getElementById('wamount').value),method=document.getElementById('wmethod').value,account=document.getElementById('waccount').value.trim();if(!amount||!account)return toast('أكمل البيانات');if(!/^0\d{9}$/.test(account))return toast('الرقم يجب أن يكون 10 أرقام');try{await cf('requestWithdrawal')({amount,method,account});toast('تم إرسال طلب السحب');}catch(e){toast(e.message||'تعذر طلب السحب')}}

async function saveAccount(){try{const phone=document.getElementById('aphone').value.trim(),age=Number(document.getElementById('aage').value),res=document.getElementById('ares').value.trim();if(!/^0\d{9}$/.test(phone))return toast('رقم الهاتف يجب أن يكون 10 أرقام');if(age<18)return toast('العمر يجب ألا يقل عن 18 سنة');const patch={phone,age,residence:res};const idf=document.getElementById('aid')?.files[0];if(idf)patch.identityUrl=await uploadFile(idf,`users/${me.uid}/identity/${Date.now()}`);if(userDoc.role==='driver'){const sf=document.getElementById('asticker')?.files[0],of=document.getElementById('aowner')?.files[0];if(sf)patch.stickerUrl=await uploadFile(sf,`users/${me.uid}/driver/${Date.now()}-sticker`);if(of)patch.ownerProofUrl=await uploadFile(of,`users/${me.uid}/driver/${Date.now()}-owner`)}await db.collection('users').doc(me.uid).update(patch);userDoc={...(await db.collection('users').doc(me.uid).get()).data()};toast('تم حفظ البيانات');renderApp()}catch(e){toast(e.message||'تعذر الحفظ')}}

  let cards='';
  s.docs.forEach(d=>{const x={id:d.id,...d.data()};cards+=`<div class="card"><b>${esc(x.userName||'مستخدم')}</b><div class="muted">${esc(x.userPhone||'')} · ${date(x.createdAt)}</div><p>${esc(x.text||'')}</p><div class="muted">الرد: ${esc(x.reply||'لم يتم الرد')}</div><div class="actions"><button class="btn secondary" onclick="replySupport('${x.id}')">الرد</button></div></div>`});
  el.innerHTML=`<div class="page-title"><h2>رسائل الدعم</h2></div><div class="list">${cards||'<div class="empty">لا توجد رسائل</div>'}</div>`;
}
async function replySupport(id){const reply=prompt('اكتب رد الإدارة');if(!reply)return;await db.collection('support').doc(id).update({reply,replyBy:me.uid,replyAt:firebase.firestore.FieldValue.serverTimestamp(),status:'replied'});toast('تم الرد');renderApp()}
async function sendSupport(){const text=document.getElementById('supportText').value.trim();if(!text)return toast('اكتب رسالتك');await db.collection('support').add({userId:me.uid,userName:userDoc.name,userPhone:userDoc.phone,subject:'تواصل مع الإدارة',text,status:'open',createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast('تم إرسال الرسالة');renderApp()}
async function renderUsers(el){const s=await db.collection('users').get();const us=s.docs.map(d=>({id:d.id,...d.data()}));el.innerHTML=`<div class="page-title"><h2>المستخدمون</h2></div><div class="card table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الدور</th><th>الحالة</th><th>أيام النشاط</th><th>آخر نشاط</th><th>أيام عدم النشاط</th><th>المراجعة</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.name||'')}</td><td>${roleLabel(u.role)}</td><td>${u.isBlocked?'موقوف':u.isActive?'نشط':'غير مفعل'}</td><td>${u.activeDays?.length||0}</td><td>${date(u.lastActiveAt)}</td><td>${daysInactive(u.lastActiveAt)}</td><td>${!u.isActive&&u.role!=='admin'?`<button class="btn primary" onclick="reviewActivation('${u.id}')">مراجعة التفعيل</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><div id="activation-area"></div><div class="card"><h3>إدارة المدراء</h3><p class="muted">إضافة مدير جديد تتم من خلال البريد الإلكتروني، وتُنفذ الصلاحية من وظيفة خادمية.</p><div class="field"><label>بريد المدير الجديد</label><input id="adminEmail"></div><button class="btn primary" onclick="makeAdmin()">إضافة مدير</button></div>`}
async function reviewActivation(id){
  const u=await getUser(id); if(!u)return;
  const area=document.getElementById('activation-area');
  const idLink=u.identityUrl?`<a class="btn secondary" target="_blank" href="${u.identityUrl}">إثبات شخصية</a>`:'';
  const stickerLink=u.stickerUrl?`<a class="btn secondary" target="_blank" href="${u.stickerUrl}">استيكر/شهادة الموتر</a>`:'';
  const ownerLink=u.ownerProofUrl?`<a class="btn secondary" target="_blank" href="${u.ownerProofUrl}">إثبات المالك/السائق</a>`:'';
  const fee=u.role==='driver'?(u.activationFeePaid?'موافق عليها':'غير مكتملة'):'غير مطلوبة';
  area.innerHTML='<div class="card"><div class="page-title"><h3>مراجعة: '+esc(u.name||'')+'</h3><button class="btn ghost" onclick="document.getElementById(\'activation-area\').innerHTML=\'\'">إغلاق</button></div><p class="muted">الهاتف: '+esc(u.phone||'')+' · البريد: '+esc(u.email||'')+' · السكن: '+esc(u.residence||'')+'</p><div class="actions">'+idLink+stickerLink+ownerLink+'</div><div class="notice" style="margin-top:10px">البريد متحقق: '+(u.emailVerified!==false?'نعم':'بانتظار التحقق')+' · رسوم تفعيل السائق: '+fee+'</div><div class="actions"><button class="btn primary" onclick="approveActivation(\''+id+'\',true)">موافقة وتفعيل</button><button class="btn danger" onclick="approveActivation(\''+id+'\',false)">رفض التفعيل</button></div></div>';
}
async function approveActivation(id,approve){try{await cf('reviewUserActivation')({userId:id,approve});toast(approve?'تم تفعيل الحساب':'تم رفض التفعيل');renderApp()}catch(e){toast(e.message||'تعذر المراجعة')}}
async function makeAdmin(){const email=document.getElementById('adminEmail').value.trim();if(!email)return toast('أدخل البريد');try{await cf('setAdminRole')({email});toast('تمت إضافة المدير')}catch(e){toast(e.message||'تعذر إضافة المدير')}}
async function renderAdminOrders(el){const s=await db.collection('orders').limit(200).get();const os=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));el.innerHTML=`<div class="page-title"><h2>جميع الطلبات (${os.length})</h2></div><div class="list">${os.map(o=>`<div class="card"><div class="row"><div><div class="route">${esc(o.from)} → ${esc(o.to)}</div><div class="muted">العميل: ${esc(o.customerName||'')} · السائق: ${esc(o.driverName||'غير معين')}<br>السعر: ${o.price==null?'غير محدد':money(o.price)+' ج'} · الحالة: ${esc(statusLabel(o.status))}<br>آخر تعليق: ${esc(o.lastComment||'لا يوجد')}</div></div>${tag(o.status)}</div>${o.status==='pending'&&o.pricingMode==='admin'?`<div class="actions"><input id="price-${o.id}" type="number" min="1" placeholder="تحديد السعر" style="max-width:180px"><button class="btn primary" onclick="setAdminPrice('${o.id}')">حفظ السعر</button></div>`:''}</div>`).join('')||'<div class="empty">لا توجد طلبات</div>'}</div>`}
async function setAdminPrice(id){const price=Number(document.getElementById('price-'+id).value);if(!price)return toast('أدخل السعر');try{await cf('adminSetOrderPrice')({orderId:id,price});toast('تم تحديد السعر');renderApp()}catch(e){toast(e.message||'تعذر تحديد السعر')}}
async function renderAdminTopups(el){const s=await db.collection('topups').where('status','==','pending').limit(100).get();el.innerHTML=`<div class="page-title"><h2>طلبات الشحن</h2></div><div class="list">${s.docs.map(d=>{const x={id:d.id,...d.data()};return `<div class="card"><div class="row"><div><b>${money(x.amount)} ج</b><div class="muted">${esc(x.userName||x.userId)} · ${esc(x.method)} · ${date(x.createdAt)}</div>${x.receiptUrl?`<a class="btn secondary" href="${x.receiptUrl}" target="_blank">عرض الإشعار</a>`:''}</div>${tag('pending')}</div><div class="actions"><button class="btn primary" onclick="reviewTopup('${x.id}',true)">موافقة</button><button class="btn danger" onclick="reviewTopup('${x.id}',false)">رفض</button></div></div>`}).join('')||'<div class="empty">لا توجد طلبات معلقة</div>'}</div>`}
async function reviewTopup(id,approve){try{await cf('reviewTopup')({topupId:id,approve});toast(approve?'تمت الموافقة':'تم الرفض');renderApp()}catch(e){toast(e.message||'تعذر المراجعة')}}
async function renderAdminWithdrawals(el){const s=await db.collection('withdrawals').where('status','==','pending').limit(100).get();el.innerHTML=`<div class="page-title"><h2>طلبات السحب</h2></div><div class="list">${s.docs.map(d=>{const x={id:d.id,...d.data()};return `<div class="card"><div class="row"><div><b>${money(x.amount)} ج</b><div class="muted">${esc(x.userName||'')} · ${esc(x.method)} · ${esc(x.account||'')}</div></div>${tag('pending')}</div><div class="actions"><button class="btn primary" onclick="reviewWithdraw('${x.id}',true)">موافقة</button><button class="btn danger" onclick="reviewWithdraw('${x.id}',false)">رفض وإرجاع الرصيد</button></div></div>`}).join('')||'<div class="empty">لا توجد سحوبات معلقة</div>'}</div>`}
async function reviewWithdraw(id,approve){try{await cf('reviewWithdrawal')({withdrawalId:id,approve});toast(approve?'تمت الموافقة على السحب':'تم الرفض وإرجاع الرصيد');renderApp()}catch(e){toast(e.message||'تعذر المراجعة')}}
function renderSettings(el){el.innerHTML=`<div class="page-title"><h2>إعدادات المنصة</h2></div><div class="card"><h3>طرق الدفع</h3><p class="muted">${METHODS.join(' · ')}</p><h3>رقم الإدارة</h3><p class="muted">0964499266</p><h3>نظام الزمن</h3><p class="muted">الطلبات تسجل وقت القبول والاستلام والوصول والتأكيد النهائي.</p><h3>الإشعارات</h3><p class="muted">Web Push عبر Firebase Cloud Messaging، مع listener لحظي للطلبات والمعاملات.</p></div>`}
function setupRealtime(){unsubs.forEach(u=>u&&u());unsubs=[];if(!READY||!me)return;const ref=db.collection('users').doc(me.uid);unsubs.push(ref.onSnapshot(s=>{if(s.exists){userDoc={id:s.id,...s.data()};if(document.getElementById('page'))renderPage()}}));if(userDoc?.role==='driver'&&userDoc.isActive){unsubs.push(db.collection('orders').where('status','==','pending').onSnapshot(()=>{if(S.page==='orders')renderPage()}))}}
async function requestNotifications(force){if(!READY||!('Notification' in window)||!firebase.messaging)return;if(!CFG.vapidKey||CFG.vapidKey.startsWith('REPLACE_')){if(force)toast('أضف VAPID key في CONFIG');return}try{const p=Notification.permission==='granted'?'granted':(force?await Notification.requestPermission():'default');if(p!=='granted')return;msg=msg||firebase.messaging();const token=await msg.getToken({vapidKey:CFG.vapidKey});if(token)await db.collection('users').doc(me.uid).collection('tokens').doc(btoa(token).slice(0,120)).set({token,createdAt:firebase.firestore.FieldValue.serverTimestamp(),userAgent:navigator.userAgent});toast('تم تفعيل الإشعارات')}catch(e){if(force)toast('تعذر تفعيل الإشعارات')}}
function logout(){auth?.signOut();me=null;userDoc=null;unsubs.forEach(u=>u&&u());mount()}
async function bootstrap(){if(!READY){mount();return}firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();storage=firebase.storage();fn=firebase.functions();try{msg=firebase.messaging()}catch{}auth.onAuthStateChanged(async u=>{if(!u){me=null;userDoc=null;mount();return}await enterUser(u);setupRealtime();});}
window.acceptOrder=acceptOrder;window.picked=picked;window.driverDelivered=driverDelivered;window.confirmOrder=confirmOrder;window.commentPrice=commentPrice;window.rateOrder=rateOrder;window.requestNotifications=requestNotifications;window.login=login;window.googleLogin=googleLogin;window.googleRegister=googleRegister;window.resetPass=resetPass;window.register=register;window.renderRegExtra=renderRegExtra;window.logout=logout;window.saveAccount=saveAccount;window.sendVerify=sendVerify;window.createOrder=createOrder;window.submitTopup=submitTopup;window.requestWithdraw=requestWithdraw;window.sendSupport=sendSupport;window.makeAdmin=makeAdmin;window.reviewTopup=reviewTopup;window.reviewWithdraw=reviewWithdraw;window.contact=contact;window.S=S;
bootstrap();
setInterval(()=>document.querySelectorAll('[data-timer]').forEach(el=>{const start=Number(el.dataset.timer);const sec=Math.max(0,Math.floor((Date.now()-start)/1000));const h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');el.textContent=`زمن الرحلة: ${h}:${m}:${s}`}),1000);
</script>
</body>
